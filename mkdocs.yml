site_name: ReleaseTracker
site_description: 轻量级、可配置的版本追踪与更新编排工具
site_author: dalamudx
site_url: https://dalamudx.github.io/ReleaseTracker/
repo_name: dalamudx/ReleaseTracker
repo_url: https://github.com/dalamudx/ReleaseTracker
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            开始使用: Getting started
            安装与首次运行: Installation and first run
            配置与使用: Usage guides
            追踪器与版本规则: Trackers and version rules
            凭证与运行时连接: Credentials and runtimes
            执行器与更新策略: Executors and update policies
            健康检查与回滚: Health checks and rollback
            Webhook 通知: Webhook notifications
            部署与运维: Operations
            反向代理与子路径: Reverse proxy and sub-paths
            管理员与 OIDC: Administrator and OIDC
            备份、升级与密钥: Backups, upgrades, and keys
            参考: Reference
            系统设置: System settings
            支持范围: Support matrix
            故障排查: Troubleshooting

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Keep legacy pages published for old URLs, but omit them from navigation/search.
not_in_nav: |
  /configuration/flow*.md
  /limitations*.md

nav:
  - 首页: index.md
  - 开始使用:
      - 安装与首次运行: getting-started/installation.md
  - 配置与使用:
      - 追踪器与版本规则: guides/trackers.md
      - 凭证与运行时连接: guides/runtime-connections.md
      - 执行器与更新策略: guides/executors.md
      - 健康检查与回滚: guides/health-and-rollback.md
      - Webhook 通知: guides/notifications.md
  - 部署与运维:
      - 反向代理与子路径: operations/reverse-proxy.md
      - 管理员与 OIDC: operations/accounts-and-oidc.md
      - 备份、升级与密钥: operations/backup-and-upgrade.md
  - 参考:
      - 系统设置: reference/settings.md
      - 支持范围: reference/support.md
      - 故障排查: reference/troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dalamudx/ReleaseTracker
