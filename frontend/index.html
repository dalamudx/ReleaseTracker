<!doctype html>
<html lang="zh-CN">

<head>
  <!-- APP_BASE_HREF -->
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./logo.svg?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ReleaseTracker - Track software releases from multiple sources like GitHub, GitLab, and more in one unified dashboard." />
  <script>
    (() => {
      try {
        const parsed = JSON.parse(localStorage.getItem("vite-ui-theme-config") || "null");
        const mode = parsed?.mode === "light" || parsed?.mode === "dark" || parsed?.mode === "system" ? parsed.mode : "system";
        const resolved = mode === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : mode;
        document.documentElement.classList.add(resolved);
        if (typeof parsed?.color === "string" && parsed.color !== "neutral") {
          document.documentElement.dataset.theme = parsed.color;
        }
        if (parsed?.zoom === "default" || parsed?.zoom === "scaled" || parsed?.zoom === "mono") {
          document.documentElement.dataset.scale = parsed.zoom;
        }
        if (typeof parsed?.radius === "number" && Number.isFinite(parsed.radius)) {
          document.documentElement.style.setProperty("--radius", `${Math.min(1, Math.max(0, parsed.radius))}rem`);
        }
      } catch {
        document.documentElement.classList.add(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }
    })();
  </script>
  <title>ReleaseTracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
